<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>みつけた！</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: "Hiragino Maru Gothic ProN", "Yu Gothic", sans-serif;
    background: #fff8e1;
    touch-action: manipulation;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  header {
    height: 96px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 20px;
    background: #ffd54f;
    font-size: 28px;
    font-weight: bold;
    color: #5d4037;
  }
  #goal { font-size: 56px; line-height: 1; margin-left: 12px; }
  #wrap { position: relative; flex: 1; overflow: hidden; }
  .item {
    position: absolute;
    line-height: 1;
    cursor: pointer;
    padding: 4px;               /* タップ範囲を少し広げる */
  }
  .shake { animation: shake .3s; }
  @keyframes shake {
    0%,100% { transform: translateX(0); }
    25% { transform: translateX(-8px); }
    75% { transform: translateX(8px); }
  }
  #msg {
    position: fixed; inset: 0;
    display: none;
    align-items: center; justify-content: center;
    font-size: 72px; font-weight: bold; color: #e65100;
    background: rgba(255,255,255,.75);
    pointer-events: none;
  }
</style>
</head>
<body>
<header>
  <div>これを さがせ！<span id="goal"></span></div>
  <div>スコア：<span id="score">0</span></div>
</header>
<div id="wrap"></div>
<div id="msg">みつけた！🎉</div>

<script>
(() => {
  const EMOJI = ["🐶","🐱","🐭","🐰","🦊","🐻","🐼","🐸","🐵","🐔",
                 "🐧","🐢","🐙","🐠","🦋","🐝","🍎","🍌","🍓","🚗","🚌","⚽","🎈","⭐"];
  const MARGIN = 12;
  const wrap  = document.getElementById("wrap");
  const goal  = document.getElementById("goal");
  const scoreEl = document.getElementById("score");
  const msg   = document.getElementById("msg");

  let score = 0;
  let target = "";
  let locked = false;

  const rand = (a, b) => a + Math.random() * (b - a);
  const pick = arr => arr[Math.floor(Math.random() * arr.length)];

  function build() {
    const W = wrap.clientWidth  || window.innerWidth;
    const H = wrap.clientHeight || (window.innerHeight - 120);

    /* フィラーアイテム数（密度）：画面サイズに応じて */
    const COUNT = Math.floor((W * H) / 22000);
    const FSIZE_MIN = 56, FSIZE_MAX = 88;

    wrap.innerHTML = "";
    goal.textContent = target;

    const fillers = EMOJI.filter(e => e !== target);

    function place(char, isTarget) {
      const size = Math.round(rand(FSIZE_MIN, FSIZE_MAX));
      const el = document.createElement("div");
      el.className = "item";
      el.textContent = char;
      el.style.fontSize = size + "px";
      const box = size + 8; /* padding分 */
      el.style.left = Math.round(rand(MARGIN, Math.max(MARGIN, W - box - MARGIN))) + "px";
      el.style.top  = Math.round(rand(MARGIN, Math.max(MARGIN, H - box - MARGIN))) + "px";
      el.addEventListener("pointerdown", e => {
        e.preventDefault();
        if (locked) return;
        isTarget ? found() : miss(el);
      });
      wrap.appendChild(el);
    }

    for (let i = 0; i < COUNT; i++) place(pick(fillers), false);
    /* ターゲットを必ず1個配置（最後＝一番上に描画） */
    place(target, true);
  }

  function newRound() {
    target = pick(EMOJI);
    locked = false;
    build();
  }

  function found() {
    locked = true;
    score++;
    scoreEl.textContent = score;
    msg.style.display = "flex";
    setTimeout(() => { msg.style.display = "none"; newRound(); }, 1000);
  }

  function miss(el) {
    el.classList.remove("shake");
    void el.offsetWidth;           /* アニメーション再始動 */
    el.classList.add("shake");
  }

  /* 画面の向き・サイズ変更で再配置（ターゲットは同じまま） */
  let timer;
  const relayout = () => { clearTimeout(timer); timer = setTimeout(build, 200); };
  window.addEventListener("resize", relayout);
  window.addEventListener("orientationchange", relayout);

  newRound();
})();
</script>
</body>
</html>
